<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" viewBox="0 0 1040 520" role="img" aria-label="BAR1 从256MiB扩大到32768MiB，静态与动态映射原理对照"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10182C"/><stop offset="1" stop-color="#1B2441"/></linearGradient><linearGradient id="a" x1="0" x2="1"><stop stop-color="#8E8BFF"/><stop offset="1" stop-color="#A8DEFF"/></linearGradient><linearGradient id="b" x1="0" x2="1"><stop stop-color="#FFB17E"/><stop offset="1" stop-color="#FFDCA6"/></linearGradient></defs><rect width="1040" height="520" rx="24" fill="url(#bg)"/><rect x="15" y="15" width="1010" height="490" rx="18" fill="none" stroke="#50607A" opacity=".35"/><text x="50" y="70" fill="#FFFFFF" font-size="30" font-family="Inter,Arial,'Noto Sans CJK SC',sans-serif" font-weight="700" text-anchor="start">BAR1 是地址窗口，不是显存容量</text><text x="55" y="125" fill="#FFCA99" font-size="21" font-family="Inter,Arial,'Noto Sans CJK SC',sans-serif" font-weight="600" text-anchor="start">初始化时：BAR1 = 256 MiB</text><rect x="55" y="146" width="425" height="28" rx="5" fill="#2B354A" opacity="1"/><rect x="55" y="146" width="16" height="28" rx="5" fill="url(#b)" opacity="1"/><text x="55" y="207" fill="#B6C7E7" font-size="17" font-family="Inter,Arial,'Noto Sans CJK SC',sans-serif" font-weight="500" text-anchor="start">256 MiB / 24 GiB（仅示意比例）</text><text x="555" y="125" fill="#A7DAFF" font-size="21" font-family="Inter,Arial,'Noto Sans CJK SC',sans-serif" font-weight="600" text-anchor="start">BIOS + ReBAR：BAR1 = 32 GiB</text><rect x="555" y="146" width="425" height="28" rx="5" fill="#2B354A" opacity="1"/><rect x="555" y="146" width="425" height="28" rx="5" fill="url(#a)" opacity="1"/><text x="555" y="207" fill="#B6C7E7" font-size="17" font-family="Inter,Arial,'Noto Sans CJK SC',sans-serif" font-weight="500" text-anchor="start">地址空间覆盖 24 GiB FB，仍非新增显存</text><path d="M60 235L980 235" fill="none" stroke="#50617F" stroke-width="1" /><text x="55" y="278" fill="#FEF8FF" font-size="21" font-family="Inter,Arial,'Noto Sans CJK SC',sans-serif" font-weight="650" text-anchor="start">静态映射（本次 24GB 卡的可能路径）</text><rect x="55" y="303" width="420" height="132" rx="12" fill="#283A55" opacity="1"/><text x="75" y="338" fill="#C6EAFF" font-size="19" font-family="Inter,Arial,'Noto Sans CJK SC',sans-serif" font-weight="500" text-anchor="start">PCIe bus = BAR1_base + FB_offset</text><text x="75" y="373" fill="#BFCEE5" font-size="17" font-family="Inter,Arial,'Noto Sans CJK SC',sans-serif" font-weight="500" text-anchor="start">要求 BAR1 aperture 覆盖所需 FB 范围</text><text x="75" y="403" fill="#A6BAD0" font-size="16" font-family="Inter,Arial,'Noto Sans CJK SC',sans-serif" font-weight="500" text-anchor="start">具体使用路径仍需驱动级日志验证</text><text x="555" y="278" fill="#FEF8FF" font-size="21" font-family="Inter,Arial,'Noto Sans CJK SC',sans-serif" font-weight="650" text-anchor="start">动态映射（参考文章 48GB 场景）</text><rect x="555" y="303" width="425" height="132" rx="12" fill="#3B3355" opacity="1"/><text x="575" y="338" fill="#E4D7FF" font-size="18" font-family="Inter,Arial,'Noto Sans CJK SC',sans-serif" font-weight="500" text-anchor="start">PCIe bus = BAR1_base + window_offset</text><text x="575" y="373" fill="#D0C7E8" font-size="18" font-family="Inter,Arial,'Noto Sans CJK SC',sans-serif" font-weight="500" text-anchor="start">BAR1 slot → GMMU → FB 物理页</text><text x="575" y="403" fill="#BBADCD" font-size="16" font-family="Inter,Arial,'Noto Sans CJK SC',sans-serif" font-weight="500" text-anchor="start">按需显式映射单个 peer allocation</text></svg>