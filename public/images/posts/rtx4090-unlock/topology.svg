<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="565" viewBox="0 0 1120 565" role="img" aria-label="四卡 NUMA 拓扑与 P2P 有向传输对比"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10182C"/><stop offset="1" stop-color="#1B2441"/></linearGradient><linearGradient id="a" x1="0" x2="1"><stop stop-color="#8E8BFF"/><stop offset="1" stop-color="#A8DEFF"/></linearGradient><linearGradient id="b" x1="0" x2="1"><stop stop-color="#FFB17E"/><stop offset="1" stop-color="#FFDCA6"/></linearGradient></defs><rect width="1120" height="565" rx="24" fill="url(#bg)"/><rect x="15" y="15" width="1090" height="535" rx="18" fill="none" stroke="#50607A" opacity=".35"/><text x="52" y="70" fill="#FFFFFF" font-size="30" font-family="Inter,Arial,'Noto Sans CJK SC',sans-serif" font-weight="750" text-anchor="start">每节点的四卡 NUMA 拓扑</text><text x="52" y="110" fill="#B4C4DE" font-size="17" font-family="Inter,Arial,'Noto Sans CJK SC',sans-serif" font-weight="500" text-anchor="start">GPU0/1 和 GPU2/3 位于不同 CPU NUMA 域；带宽为本次样本测量</text><rect x="90" y="155" width="432" height="285" rx="16" fill="#302F55" opacity="1"/><text x="306" y="199" fill="#E8ECFF" font-size="25" font-family="Inter,Arial,'Noto Sans CJK SC',sans-serif" font-weight="720" text-anchor="middle">NUMA 0</text><rect x="130" y="232" width="158" height="72" rx="13" fill="#46567D" opacity="1"/><text x="209" y="277" fill="#FFFFFF" font-size="23" font-family="Inter,Arial,'Noto Sans CJK SC',sans-serif" font-weight="700" text-anchor="middle">GPU 0</text><rect x="318" y="232" width="158" height="72" rx="13" fill="#46567D" opacity="1"/><text x="397" y="277" fill="#FFFFFF" font-size="23" font-family="Inter,Arial,'Noto Sans CJK SC',sans-serif" font-weight="700" text-anchor="middle">GPU 1</text><path d="M209 330L397 330" fill="none" stroke="#A5DAFF" stroke-width="6" /><text x="306" y="361" fill="#AADFFB" font-size="20" font-family="Inter,Arial,'Noto Sans CJK SC',sans-serif" font-weight="600" text-anchor="middle">≈ 20–21 GiB/s</text><rect x="625" y="155" width="432" height="285" rx="16" fill="#283852" opacity="1"/><text x="841" y="199" fill="#E8ECFF" font-size="25" font-family="Inter,Arial,'Noto Sans CJK SC',sans-serif" font-weight="720" text-anchor="middle">NUMA 1</text><rect x="665" y="232" width="158" height="72" rx="13" fill="#46567D" opacity="1"/><text x="744" y="277" fill="#FFFFFF" font-size="23" font-family="Inter,Arial,'Noto Sans CJK SC',sans-serif" font-weight="700" text-anchor="middle">GPU 2</text><rect x="853" y="232" width="158" height="72" rx="13" fill="#46567D" opacity="1"/><text x="932" y="277" fill="#FFFFFF" font-size="23" font-family="Inter,Arial,'Noto Sans CJK SC',sans-serif" font-weight="700" text-anchor="middle">GPU 3</text><path d="M744 330L932 330" fill="none" stroke="#A5DAFF" stroke-width="6" /><text x="841" y="361" fill="#AADFFB" font-size="20" font-family="Inter,Arial,'Noto Sans CJK SC',sans-serif" font-weight="600" text-anchor="middle">≈ 20–21 GiB/s</text><path d="M500 420L620 420" fill="none" stroke="#FFBE87" stroke-width="5" stroke-dasharray="9 7"/><text x="559" y="466" fill="#FFC99E" font-size="20" font-family="Inter,Arial,'Noto Sans CJK SC',sans-serif" font-weight="650" text-anchor="middle">跨 NUMA ≈ 16–17 GiB/s</text></svg>